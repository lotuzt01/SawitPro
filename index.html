<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmcore Pro - Manajemen TBS Kelapa Sawit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif']
                    },
                    colors: {
                        palm: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        },
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-primary: #030a06;
            --bg-secondary: #0a1f0f;
            --bg-card: #0f2917;
            --border: #1a4025;
            --accent: #22c55e;
            --accent-gold: #f59e0b;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--bg-secondary);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Background Pattern */
        .bg-pattern {
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L30 60M0 30L60 30' stroke='%231a4025' stroke-width='0.5' fill='none'/%3E%3C/svg%3E");
            background-size: 100% 100%, 100% 100%, 60px 60px;
        }

        /* Glass Card */
        .glass-card {
            background: linear-gradient(135deg, rgba(15, 41, 23, 0.9) 0%, rgba(10, 31, 15, 0.95) 100%);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #22c55e 0%, #4ade80 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Input Style */
        .input-field {
            background: rgba(3, 10, 6, 0.6);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            outline: none;
        }

        /* Button Styles */
        .btn-primary {
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }

        /* Navigation */
        .nav-item {
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
            transition: height 0.3s ease;
        }

        .nav-item:hover::before,
        .nav-item.active::before {
            height: 70%;
        }

        .nav-item.active {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent);
        }

        /* Stat Card */
        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Table Row Hover */
        .table-row {
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background: rgba(34, 197, 94, 0.05);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(34, 197, 94, 0.5);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.6s ease forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.5s ease forwards;
        }

        .animate-pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }

        /* Chart Container */
        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Modal */
        .modal-overlay {
            background: rgba(3, 10, 6, 0.9);
            backdrop-filter: blur(5px);
        }

        /* Status Badge */
        .badge-success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-pending {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.3);
        }

        /* Floating Elements */
        .float-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Mobile Bottom Nav */
        @media (max-width: 1023px) {
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 50;
                background: var(--bg-card);
                border-top: 1px solid var(--border);
                padding: 0.5rem;
            }
        }

        /* Custom Scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #16a34a;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen">
    <!-- App Container -->
    <div id="app"></div>

    <script>
        // ==================== DATA STORE ====================
        const Store = {
            users: JSON.parse(localStorage.getItem('palmcore_users')) || [
                { id: 1, name: 'Admin Palmcore', email: 'admin@palmcore.id', phone: '081234567890', password: 'admin123', role: 'pabrik', createdAt: new Date().toISOString() }
            ],
            currentUser: JSON.parse(localStorage.getItem('palmcore_currentUser')) || null,
            prices: JSON.parse(localStorage.getItem('palmcore_prices')) || [],
            transactions: JSON.parse(localStorage.getItem('palmcore_transactions')) || [],
            payments: JSON.parse(localStorage.getItem('palmcore_payments')) || [],
            
            save() {
                localStorage.setItem('palmcore_users', JSON.stringify(this.users));
                localStorage.setItem('palmcore_currentUser', JSON.stringify(this.currentUser));
                localStorage.setItem('palmcore_prices', JSON.stringify(this.prices));
                localStorage.setItem('palmcore_transactions', JSON.stringify(this.transactions));
                localStorage.setItem('palmcore_payments', JSON.stringify(this.payments));
            },
            
            initSampleData() {
                // Sample prices
                if (this.prices.length === 0) {
                    const today = new Date();
                    for (let i = 30; i >= 0; i--) {
                        const date = new Date(today);
                        date.setDate(date.getDate() - i);
                        this.prices.push({
                            id: Date.now() + i,
                            date: date.toISOString().split('T')[0],
                            price: Math.floor(Math.random() * 500) + 2500,
                            createdAt: date.toISOString()
                        });
                    }
                }
                
                // Sample transactions
                if (this.transactions.length === 0) {
                    const buyers = ['PT. Sawit Jaya', 'CV. Karya Mandiri', 'PT. Nusantara Agro'];
                    const sellers = ['Bpk. Ahmad', 'Bpk. Budi', 'Ibu Siti', 'Pak Haji'];
                    
                    for (let i = 10; i >= 0; i--) {
                        const date = new Date();
                        date.setDate(date.getDate() - Math.floor(Math.random() * 30));
                        const qty = Math.floor(Math.random() * 500) + 100;
                        const price = Math.floor(Math.random() * 500) + 2500;
                        
                        this.transactions.push({
                            id: Date.now() + i * 100,
                            buyer: buyers[Math.floor(Math.random() * buyers.length)],
                            seller: sellers[Math.floor(Math.random() * sellers.length)],
                            quantity: qty,
                            pricePerKg: price,
                            totalPrice: qty * price,
                            status: Math.random() > 0.3 ? 'completed' : 'pending',
                            date: date.toISOString(),
                            createdAt: date.toISOString()
                        });
                    }
                }
                
                // Sample payments
                if (this.payments.length === 0) {
                    const methods = ['transfer', 'e-wallet', 'cash'];
                    for (let i = 5; i >= 0; i--) {
                        const date = new Date();
                        date.setDate(date.getDate() - Math.floor(Math.random() * 20));
                        
                        this.payments.push({
                            id: Date.now() + i * 200,
                            transactionId: this.transactions[Math.floor(Math.random() * this.transactions.length)]?.id || 1,
                            amount: Math.floor(Math.random() * 2000000) + 500000,
                            method: methods[Math.floor(Math.random() * methods.length)],
                            status: Math.random() > 0.4 ? 'success' : 'pending',
                            date: date.toISOString(),
                            note: 'Pembayaran transaksi TBS'
                        });
                    }
                }
                
                this.save();
            }
        };

        // Initialize sample data
        Store.initSampleData();

        // ==================== UTILITY FUNCTIONS ====================
        const Utils = {
            formatCurrency(num) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
            },
            formatDate(dateStr) {
                return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(dateStr));
            },
            formatNumber(num) {
                return new Intl.NumberFormat('id-ID').format(num);
            },
            generateId() {
                return Date.now() + Math.random().toString(36).substr(2, 9);
            }
        };

        // ==================== ROUTER ====================
        const Router = {
            currentPage: 'login',
            
            navigate(page) {
                this.currentPage = page;
                App.render();
                window.scrollTo(0, 0);
            },
            
            checkAuth() {
                if (!Store.currentUser && !['login', 'register'].includes(this.currentPage)) {
                    this.navigate('login');
                    return false;
                }
                return true;
            }
        };

        // ==================== CHART DRAWING ====================
        const Chart = {
            drawLineChart(canvasId, data, options = {}) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                
                const width = rect.width;
                const height = rect.height;
                const padding = { top: 20, right: 20, bottom: 40, left: 60 };
                const chartWidth = width - padding.left - padding.right;
                const chartHeight = height - padding.top - padding.bottom;
                
                // Clear
                ctx.clearRect(0, 0, width, height);
                
                // Data processing
                const values = data.map(d => d.value);
                const minVal = Math.min(...values) * 0.95;
                const maxVal = Math.max(...values) * 1.05;
                const range = maxVal - minVal;
                
                // Draw grid
                ctx.strokeStyle = 'rgba(26, 64, 37, 0.5)';
                ctx.lineWidth = 1;
                
                for (let i = 0; i <= 4; i++) {
                    const y = padding.top + (chartHeight / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();
                    
                    // Y-axis labels
                    const val = maxVal - (range / 4) * i;
                    ctx.fillStyle = '#9ca3af';
                    ctx.font = '11px DM Sans';
                    ctx.textAlign = 'right';
                    ctx.fillText(Utils.formatNumber(Math.round(val)), padding.left - 10, y + 4);
                }
                
                // Draw line
                if (data.length > 0) {
                    const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
                    gradient.addColorStop(0, 'rgba(34, 197, 94, 0.3)');
                    gradient.addColorStop(1, 'rgba(34, 197, 94, 0)');
                    
                    // Fill area
                    ctx.beginPath();
                    data.forEach((d, i) => {
                        const x = padding.left + (chartWidth / (data.length - 1)) * i;
                        const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.lineTo(padding.left + chartWidth, height - padding.bottom);
                    ctx.lineTo(padding.left, height - padding.bottom);
                    ctx.closePath();
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    // Draw line
                    ctx.beginPath();
                    data.forEach((d, i) => {
                        const x = padding.left + (chartWidth / (data.length - 1)) * i;
                        const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Draw points
                    data.forEach((d, i) => {
                        const x = padding.left + (chartWidth / (data.length - 1)) * i;
                        const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#22c55e';
                        ctx.fill();
                        ctx.strokeStyle = '#030a06';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                }
                
                // X-axis labels
                const labelInterval = Math.ceil(data.length / 6);
                ctx.fillStyle = '#9ca3af';
                ctx.font = '10px DM Sans';
                ctx.textAlign = 'center';
                data.forEach((d, i) => {
                    if (i % labelInterval === 0 || i === data.length - 1) {
                        const x = padding.left + (chartWidth / (data.length - 1)) * i;
                        ctx.fillText(d.label, x, height - padding.bottom + 20);
                    }
                });
            },
            
            drawBarChart(canvasId, data) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                
                const width = rect.width;
                const height = rect.height;
                const padding = { top: 20, right: 20, bottom: 40, left: 60 };
                const chartWidth = width - padding.left - padding.right;
                const chartHeight = height - padding.top - padding.bottom;
                
                ctx.clearRect(0, 0, width, height);
                
                const values = data.map(d => d.value);
                const maxVal = Math.max(...values) * 1.1;
                
                // Draw grid
                ctx.strokeStyle = 'rgba(26, 64, 37, 0.5)';
                ctx.lineWidth = 1;
                
                for (let i = 0; i <= 4; i++) {
                    const y = padding.top + (chartHeight / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();
                    
                    const val = maxVal - (maxVal / 4) * i;
                    ctx.fillStyle = '#9ca3af';
                    ctx.font = '11px DM Sans';
                    ctx.textAlign = 'right';
                    ctx.fillText(Utils.formatNumber(Math.round(val)), padding.left - 10, y + 4);
                }
                
                // Draw bars
                const barWidth = (chartWidth / data.length) * 0.6;
                const gap = (chartWidth / data.length) * 0.4;
                
                data.forEach((d, i) => {
                    const x = padding.left + (chartWidth / data.length) * i + gap / 2;
                    const barHeight = (d.value / maxVal) * chartHeight;
                    const y = padding.top + chartHeight - barHeight;
                    
                    // Bar gradient
                    const gradient = ctx.createLinearGradient(x, y, x, y + barHeight);
                    gradient.addColorStop(0, '#22c55e');
                    gradient.addColorStop(1, '#16a34a');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
                    ctx.fill();
                    
                    // X-axis label
                    ctx.fillStyle = '#9ca3af';
                    ctx.font = '10px DM Sans';
                    ctx.textAlign = 'center';
                    ctx.fillText(d.label, x + barWidth / 2, height - padding.bottom + 20);
                });
            }
        };

        // ==================== COMPONENTS ====================
        const Components = {
            // Login Page
            loginPage() {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                        <!-- Floating Blobs -->
                        <div class="float-blob w-96 h-96 bg-palm-600/20 -top-48 -left-48"></div>
                        <div class="float-blob w-64 h-64 bg-amber-500/10 bottom-20 right-10"></div>
                        
                        <div class="glass-card rounded-2xl p-8 w-full max-w-md animate-scale-in relative z-10">
                            <!-- Logo -->
                            <div class="text-center mb-8">
                                <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-br from-palm-600 to-palm-500 mb-4 animate-pulse-glow">
                                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                                    </svg>
                                </div>
                                <h1 class="font-display text-3xl font-bold gradient-text">Palmcore Pro</h1>
                                <p class="text-gray-400 mt-2">Sistem Manajemen TBS Kelapa Sawit</p>
                            </div>
                            
                            <!-- Login Form -->
                            <form id="loginForm" class="space-y-5">
                                <div class="animate-fade-in-up stagger-1" style="opacity: 0">
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                                    <input type="email" id="loginEmail" required
                                        class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500"
                                        placeholder="email@example.com">
                                </div>
                                
                                <div class="animate-fade-in-up stagger-2" style="opacity: 0">
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                                    <div class="relative">
                                        <input type="password" id="loginPassword" required
                                            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 pr-12"
                                            placeholder="Masukkan password">
                                        <button type="button" onclick="togglePassword('loginPassword')"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="animate-fade-in-up stagger-3" style="opacity: 0">
                                    <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-white">
                                        Masuk
                                    </button>
                                </div>
                                
                                <div id="loginError" class="hidden text-red-400 text-sm text-center"></div>
                                
                                <div class="text-center animate-fade-in-up stagger-4" style="opacity: 0">
                                    <span class="text-gray-400">Belum punya akun? </span>
                                    <button type="button" onclick="Router.navigate('register')" 
                                        class="text-palm-400 hover:text-palm-300 font-medium transition-colors">
                                        Daftar Sekarang
                                    </button>
                                </div>
                            </form>
                            
                            <!-- Demo Account Info -->
                            <div class="mt-6 p-4 rounded-xl bg-palm-900/50 border border-palm-800">
                                <p class="text-xs text-gray-400 text-center">
                                    Demo: admin@palmcore.id / admin123
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            },
            
            // Register Page

                        t.seller.toLowerCase().includes(searchTerm) ||

        let modalContainer = null;
        
        function showModal(content) {
            if (!modalContainer) {
                modalContainer = document.createElement('div');
                modalContainer.id = 'modalContainer';
                document.body.appendChild(modalContainer);
            }
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in-up" onclick="closeModal(event)">
                    <div class="glass-card rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto animate-scale-in" onclick="event.stopPropagation()">
                        ${content}
                    </div>
                </div>
            `;
        }
        
        function closeModal(event) {
            if (event && event.target !== modalContainer.querySelector('.modal-overlay')) return;
            if (modalContainer) {
                modalContainer.innerHTML = '';
            }
        }

        function exportToCSV() {
            let csv = 'Tanggal, Penjual, Pembeli, Jumlah (kg), Harga/kg, Total, Status\n';
            Store.transactions.forEach(t => {
                csv += `${t.date}, ${t.seller}, ${t.buyer}, ${t.quantity}, ${t.pricePerKg}, ${t.totalPrice}, ${t.status}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `palmcore_transaksi_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ==================== FORM HANDLERS ====================
        function initFormHandlers() {
            // Login Form
            document.getElementById('loginForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                const user = Store.users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    Store.currentUser = user;
                    Store.save();
                    Router.navigate('dashboard');
                } else {
                    const errorEl = document.getElementById('loginError');
                    errorEl.textContent = 'Email atau password salah';
                    errorEl.classList.remove('hidden');
                }
            });
            
            // Register Form
            document.getElementById('registerForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('regName').value;
                const email = document.getElementById('regEmail').value;
                const phone = document.getElementById('regPhone').value;
                const role = document.getElementById('regRole').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                
                const errorEl = document.getElementById('registerError');
                const successEl = document.getElementById('registerSuccess');
                
                errorEl.classList.add('hidden');
                successEl.classList.add('hidden');
                
                // Validations
                if (password !== confirmPassword) {
                    errorEl.textContent = 'Password tidak cocok';
                    errorEl.classList.remove('hidden');
                    return;
                }
                
                if (Store.users.find(u => u.email === email)) {
                    errorEl.textContent = 'Email sudah terdaftar';
                    errorEl.classList.remove('hidden');
                    return;
                }
                
                // Create user
                const newUser = {
                    id: Utils.generateId(),
                    name, email, phone, password, role,
                    createdAt: new Date().toISOString()
                };
                
                Store.users.push(newUser);
                Store.save();
                
                successEl.textContent = 'Registrasi berhasil! Silakan login.';
                successEl.classList.remove('hidden');
                
                setTimeout(() => Router.navigate('login'), 1500);
            });
            
            // Transaction Form
            document.getElementById('transactionForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const id = document.getElementById('txId').value;
                const seller = document.getElementById('txSeller').value;
                const buyer = document.getElementById('txBuyer').value;
                const quantity = parseInt(document.getElementById('txQuantity').value);
                const pricePerKg = parseInt(document.getElementById('txPrice').value);
                const date = document.getElementById('txDate').value;
                const status = document.getElementById('txStatus').value;
                
                if (id) {
                    // Edit existing
                    const tx = Store.transactions.find(t => t.id == id);
                    if (tx) {
                        Object.assign(tx, { seller, buyer, quantity, pricePerKg, totalPrice: quantity * pricePerKg, date, status });
                    }
                } else {
                    // Add new
                    Store.transactions.push({
                        id: Utils.generateId(),
                        seller, buyer, quantity, pricePerKg,
                        totalPrice: quantity * pricePerKg,
                        date, status,
                        createdAt: new Date().toISOString()
                    });
                }
                
                Store.save();
                closeModal();
                App.render();
            });
            
            // Payment Form
            document.getElementById('paymentForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                Store.payments.push({
                    id: Utils.generateId(),
                    amount: parseInt(document.getElementById('payAmount').value),
                    method: document.getElementById('payMethod').value,
                    date: document.getElementById('payDate').value,
                    note: document.getElementById('payNote').value,
                    status: 'pending'
                });
                
                Store.save();
                closeModal();
                App.render();
            });
            
            // Price Form
            document.getElementById('priceForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const date = document.getElementById('priceDate').value;
                const price = parseInt(document.getElementById('priceValue').value);
                
                // Check if price for this date exists
                const existingIndex = Store.prices.findIndex(p => p.date === date);
                
                if (existingIndex >= 0) {
                    Store.prices[existingIndex].price = price;
                } else {
                    Store.prices.push({
                        id: Utils.generateId(),
                        date, price,
                        createdAt: new Date().toISOString()
                    });
                }
                
                Store.save();
                closeModal();
                App.render();
            });
            
            // Edit Price Form
            document.getElementById('editPriceForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const id = document.getElementById('editPriceId').value;
                const price = Store.prices.find(p => p.id == id);
                
                if (price) {
                    price.date = document.getElementById('editPriceDate').value;
                    price.price = parseInt(document.getElementById('editPriceValue').value);
                    Store.save();
                }
                
                closeModal();
                App.render();
            });
            
            // Profile Form
            document.getElementById('profileForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                if (Store.currentUser) {
                    Store.currentUser.name = document.getElementById('profileName').value;
                    Store.currentUser.email = document.getElementById('profileEmail').value;
                    Store.currentUser.phone = document.getElementById('profilePhone').value;
                    
                    // Update in users array too
                    const userIndex = Store.users.findIndex(u => u.id === Store.currentUser.id);
                    if (userIndex >= 0) {
                        Store.users[userIndex] = { ...Store.users[userIndex], ...Store.currentUser };
                    }
                    
                    Store.save();
                    alert('Profil berhasil diperbarui');
                    App.render();
                }
            });
            
            // Password Form
            document.getElementById('passwordForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;
                
                if (Store.currentUser && Store.currentUser.password === oldPassword) {
                    if (newPassword === confirmNewPassword) {
                        Store.currentUser.password = newPassword;
                        
                        const userIndex = Store.users.findIndex(u => u.id === Store.currentUser.id);
                        if (userIndex >= 0) {
                            Store.users[userIndex].password = newPassword;
                        }
                        
                        Store.save();
                        alert('Password berhasil diubah');
                        document.getElementById('passwordForm').reset();
                    } else {
                        alert('Password baru tidak cocok');
                    }
                } else {
                    alert('Password lama salah');
                }
            });
            
            // Transaction search/filter
            document.getElementById('searchTransaction')?.addEventListener('input', () => {
                const tbody = document.getElementById('transactionsTableBody');
                if (tbody) tbody.innerHTML = Components.renderTransactionsTable();
            });
            
            document.getElementById('filterStatus')?.addEventListener('change', () => {
                const tbody = document.getElementById('transactionsTableBody');
                if (tbody) tbody.innerHTML = Components.renderTransactionsTable();
            });
            
            document.getElementById('filterDate')?.addEventListener('change', () => {
                const tbody = document.getElementById('transactionsTableBody');
                if (tbody) tbody.innerHTML = Components.renderTransactionsTable();
            });
        }
        
        function initCharts() {
            // Dashboard price chart
            if (Router.currentPage === 'dashboard') {
                const chartData = Store.prices.slice(-14).map(p => ({
                    label: new Date(p.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
                    value: p.price
                }));
                Chart.drawLineChart('priceChart', chartData);
            }
            
            // Prices page chart
            if (Router.currentPage === 'prices') {
                const chartData = Store.prices.slice(-30).map(p => ({
                    label: new Date(p.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
                    value: p.price
                }));
                Chart.drawLineChart('pricesChart', chartData);
            }
            
            // Reports page chart
            if (Router.currentPage === 'reports') {
                const completedTx = Store.transactions.filter(t => t.status === 'completed');
                const monthlyData = {};
                completedTx.forEach(t => {
                    const month = new Date(t.date).toLocaleDateString('id-ID', { month: 'short', year: 'numeric' });
                    if (!monthlyData[month]) monthlyData[month] = 0;
                    monthlyData[month] += t.totalPrice;
                });
                
                const chartData = Object.entries(monthlyData).slice(-6).map(([label, value]) => ({ label, value }));
                Chart.drawBarChart('reportChart', chartData);
            }
        }

        // ==================== MAIN APP ====================
        const App = {
            render() {
                const app = document.getElementById('app');
                
                // Check auth for protected pages
                if (!['login', 'register'].includes(Router.currentPage) && !Store.currentUser) {
                    Router.currentPage = 'login';
                }
                
                let content = '';
                
                switch (Router.currentPage) {
                    case 'login':
                        content = Components.loginPage();
                        break;
                    case 'register':
                        content = Components.registerPage();
                        break;
                    case 'dashboard':
                        content = Components.mainLayout(Components.dashboardPage());
                        break;
                    case 'transactions':
                        content = Components.mainLayout(Components.transactionsPage());
                        break;
                    case 'prices':
                        content = Components.mainLayout(Components.pricesPage());
                        break;
                    case 'payments':
                        content = Components.mainLayout(Components.paymentsPage());
                        break;
                    case 'reports':
                        content = Components.mainLayout(Components.reportsPage());
                        break;
                    case 'profile':
                        content = Components.mainLayout(Components.profilePage());
                        break;
                    default:
                        content = Components.loginPage();
                }
                
                app.innerHTML = content;
                
                // Initialize after render
                requestAnimationFrame(() => {
                    initFormHandlers();
                    initCharts();
                });
            }
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is logged in
            if (Store.currentUser) {
                Router.currentPage = 'dashboard';
            }
            App.render();
        });
        
        // Handle resize for charts
        window.addEventListener('resize', () => {
            initCharts();
        });
    </script>
</body>
</html>
